<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>고라니 주의보</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070d;color:#e8ecf4;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;width:100%;max-width:440px;height:100%;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#0b0f1a}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#muteBtn{position:absolute;top:10px;right:10px;z-index:5;width:38px;height:38px;border:none;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer}
.best{font-size:15px;font-weight:800;color:#ffd36b}
.soundTip{font-size:13px;font-weight:800;color:#9fd3ff;background:rgba(80,160,255,.12);border:1px solid rgba(120,180,255,.3);border-radius:999px;padding:6px 14px}
.rank{width:100%;max-width:300px;display:flex;flex-direction:column;gap:8px}
.nameRow{display:flex;gap:6px}
.nameRow input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:16px;font-family:inherit;-webkit-user-select:text;user-select:text}
.nameRow button{padding:0 14px;border:none;border-radius:12px;background:#4f8cff;color:#fff;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap}
.nameRow button:disabled{opacity:.5}
.rankTitle{font-size:13px;font-weight:800;color:#aab3c5;text-align:left}
.rankList{list-style:none;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:6px 10px;text-align:left;font-size:13px}
.rankList li{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.rankList li:last-child{border-bottom:none}
.rankList .no{width:22px;color:#8d97ab;font-weight:800}
.rankList .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankList .sc{font-weight:900;color:#ffd36b}
.rankList li.me{color:#7CFC9A}
.rankMsg{font-size:12px;color:#8d97ab;min-height:16px}
canvas{display:block;width:100%;height:100%}
#controls{position:relative;display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#070a12;border-top:1px solid #1c2333}
.btn{flex:1;height:72px;border:none;border-radius:16px;background:#1b2234;color:#e8ecf4;font-size:28px;font-family:inherit;touch-action:none;cursor:pointer;transition:transform .05s,background .1s}
.btn.pressed{transform:scale(.94);background:#2a3550}
#wipeBtn{flex:1.25;margin-left:10px;background:#1d3a4f;font-size:30px}
#wipeBtn.pressed{background:#2b5673}
#wipeBtn.hot{background:#3a3a3a;filter:grayscale(1);opacity:.6}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;text-align:center;padding:24px;background:rgba(5,7,13,.8);gap:14px}
.hidden{display:none}
h1{font-size:36px;font-weight:900;letter-spacing:-1px}
h1 span{color:#ffb347}
h2{font-size:26px;font-weight:900;color:#ff6b5e}
.sub{font-size:15px;color:#aab3c5;line-height:1.5}
.guide{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.9;text-align:left;width:100%;max-width:300px}
.guide div{display:flex;gap:10px;align-items:baseline}.guide b{flex:none;width:44px;color:#fff}
.big{font-size:64px;font-weight:900;line-height:1}
.label{font-size:13px;color:#8d97ab;margin-top:-6px}
.go{margin-top:6px;padding:16px 40px;border:none;border-radius:999px;background:#ffb347;color:#1a1206;font-size:20px;font-weight:900;font-family:inherit;cursor:pointer}
.go:active{transform:scale(.96)}
.hint{font-size:12px;color:#6c7588}
#hornBtn{position:absolute;right:14px;top:-26px;z-index:4;width:50px;height:50px;border-radius:50%;border:2px solid #ffd36b;background:conic-gradient(#3a2f12 calc(var(--p,1)*360deg),#1a1d26 0);font-size:22px;cursor:pointer;touch-action:none;box-shadow:0 2px 10px rgba(0,0,0,.6)}
#hornBtn.cool{border-color:#666;filter:grayscale(1)}
#hornBtn.pressed{transform:scale(.92)}
.guide2{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:310px}
.guide2 div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px 6px;font-size:13px;color:#d5dbe7}
.guide2 b{margin-right:5px;color:#fff}
#bestStart{margin-left:6px;font-weight:700;opacity:.85}
.btnRow{display:flex;gap:8px}
.homeBtn{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#e8ecf4}
.recBtn{padding:10px 22px;border:1px solid rgba(255,211,107,.5);border-radius:999px;background:rgba(255,211,107,.1);color:#ffd36b;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
#recOv{z-index:6;justify-content:flex-start;padding-top:56px;background:#05070d}
#recOv h2{color:#ffd36b}
.tabs{display:flex;gap:6px;width:100%;max-width:320px}
.tabs button{flex:1;padding:10px;border:none;border-radius:12px;background:rgba(255,255,255,.08);color:#aab3c5;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
.tabs button.on{background:#ffd36b;color:#1a1206}
#recOv .rankList{width:100%;max-width:320px;font-size:14px}
#recOv .rankList li{padding:6px 0}
.recSub{font-size:12px;color:#8d97ab;width:100%;max-width:320px;text-align:left}
.recClose{position:absolute;top:12px;left:12px;width:38px;height:38px;border:none;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="startOv" class="overlay">
      <h1>🦌 고라니 <span>주의보</span></h1>
      <p class="sub">비 오는 밤 국도, 튀어나오는 고라니를 피하세요!</p>
      <div class="guide2">
        <div><b>◀ ▶</b>차선 바꾸기</div>
        <div><b>🧽</b>꾹 눌러 와이퍼</div>
        <div><b>📯</b>경적 (↑ 키)</div>
        <div><b>❤️</b>목숨 3개</div>
      </div>
      <p class="soundTip">🔊 소리를 켜고 하세요</p>
      <button class="go" id="startBtn">출발</button>
      <button class="recBtn" id="recBtnStart">🏆 기록 보기<span id="bestStart"></span></button>
      <div class="hidden" id="rankStartBox"><ol id="rankStartList"></ol></div>
    </div>
    <div id="overOv" class="overlay hidden">
      <h2>고라니와 부딪혔다!</h2>
      <div class="big" id="finalScore">0</div>
      <div class="label">피한 고라니</div>
      <p class="best" id="bestOver"></p>
      <div class="rank hidden" id="rankBox">
        <div class="nameRow">
          <input id="nameInput" maxlength="10" placeholder="이름 (10자까지)" autocomplete="off" enterkeyhint="done">
          <button id="submitBtn">저장</button>
        </div>
        <div class="rankMsg" id="rankMsg"></div>
        <div class="rankTitle">🌏 전체 랭킹 TOP 10</div>
        <ol class="rankList" id="rankList"><li>불러오는 중…</li></ol>
      </div>
      <button class="go" id="againBtn">다시 출발</button>
      <div class="btnRow">
        <button class="recBtn" id="recBtnOver">🏆 기록 보기</button>
        <button class="recBtn homeBtn" id="homeBtn">🏠 처음으로</button>
      </div>
    </div>
    <div id="recOv" class="overlay hidden">
      <button class="recClose" id="recClose" aria-label="닫기">✕</button>
      <h2>🏆 기록</h2>
      <div class="tabs">
        <button id="tabAll" class="on">🌏 전체 랭킹</button>
        <button id="tabMine">📋 내 기록</button>
      </div>
      <div class="recSub" id="recSub"></div>
      <ol class="rankList" id="recList"></ol>
    </div>
  </div>
  <button id="muteBtn" aria-label="소리">🔊</button>
  <div id="controls">
    <button class="btn" id="leftBtn" aria-label="왼쪽">◀</button>
    <button class="btn" id="rightBtn" aria-label="오른쪽">▶</button>
    <button class="btn" id="wipeBtn" aria-label="와이퍼">🧽</button>
    <button id="hornBtn" class="hidden" aria-label="경적">📯</button>
  </div>
</div>
<script>
(() => {
  // ===== 기획서 숫자 =====
  const C = {
    SPEED0: 300,        // 고라니 처음 속도 (px/초)
    SPEED_STEP: 50,     // SPEED_EVERY초마다 +50
    SPEED_EVERY: 8,
    SPEED_MAX: 650,     // 속도 상한 (이 이상은 사람이 못 피함)
    JUMP_SAFE: 0.7,     // 옆 고라니가 다 건너온 뒤 차에 닿기까지 최소 시간(초)
    SPAWN0: 1.1,        // 처음 등장 간격 (초)
    SPAWN_MIN: 0.45,    // 최소 등장 간격
    SPAWN_DEC: 0.025,   // 1초마다 간격 감소량
    JUMP_FROM: 8,       // 이 시간(초)부터 옆에서 튀어나오는 고라니
    JUMP_CHANCE: 0.35,
    JUMP_SPEED: 460,    // 옆으로 뛰는 속도 (px/초)
    DROP_EVERY: 0.14,   // 빗방울 생성 간격
    DROP_MAX: 280,
    WET_RATE: 0.16,     // 앞유리가 뿌예지는 속도 (초당, 1이 최대)
    WET_CLEAR: 0.55,    // 최대 힘일 때 와이퍼 한 번에 걷히는 뿌연 정도
    WIPE_RAMP: 0.6,     // 꾹 눌러서 최대 힘이 될 때까지 걸리는 시간(초)
    DROP_CLEAR: 0.62,   // 최대 힘일 때 와이퍼 한 번에 닦이는 빗방울 비율
    BLUR_MAX: 9,        // 최대로 젖었을 때 흐림(px)
    DARK: 0.95,         // 라이트 밖 어둠 (1이면 완전 깜깜)
    LIGHT_REACH: 0.72,  // 라이트가 닿는 거리 (화면 높이 비율)
    LIGHT_SPREAD: 1.25,  // 라이트 끝 폭 (차선 폭 배수, 한쪽)
    HEAT_RISE: 50,      // 꾹 누르는 동안 초당 오르는 열기
    COOL: 25,           // 떼고 있을 때 초당 식는 양
    OVER_COOL: 40,      // 과열 중 초당 식는 양 (0이 될 때까지 사용 불가)
    LIGHTNING_MIN: 7,   // 번개 간격 최소(초)
    LIGHTNING_MAX: 15,  // 번개 간격 최대(초)
    ONCOMING_FROM: 10,  // 이 시간(초)부터 맞은편 차
    ONCOMING_MIN: 12,   // 맞은편 차 간격 최소(초)
    ONCOMING_MAX: 22,   // 맞은편 차 간격 최대(초)
    HORN_COOLDOWN: 10,  // 경적 쿨타임(초)
    FLEE_SPEED: 750,    // 경적에 놀란 고라니가 옆으로 도망가는 속도 (px/초)
    LIVES: 3,           // 목숨
    INVULN: 1.3,        // 부딪힌 뒤 무적 시간(초)
    HEART_FIRST: 15,    // 첫 하트가 나올 수 있는 시간(초)
    HEART_MIN: 18,      // 하트 간격 최소(초)
    HEART_MAX: 30,      // 하트 간격 최대(초)
    WIPE_TIME: 0.32     // 와이퍼가 한쪽에서 반대쪽까지 쓸리는 시간
  };

  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const mainCtx = cv.getContext('2d');
  const wcv = document.createElement('canvas');
  const wctx = wcv.getContext('2d');
  const mcv = document.createElement('canvas');
  const mctx = mcv.getContext('2d');
  let ctx = mainCtx;
  const startOv = document.getElementById('startOv');
  const overOv = document.getElementById('overOv');
  const finalScore = document.getElementById('finalScore');
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');
  const wipeBtn = document.getElementById('wipeBtn');
  const hornBtn = document.getElementById('hornBtn');

  let W = 0, H = 0;
  let state = 'start';
  let t, score, lane, carX, goats, drops, spawnT, dropT;
  let heat, shownHeat, over, wipeHeld = false, holdTime = 0, sweep, wipeDir = 1;
  let wet = 0;
  let lives, invuln = 0, hitShake = 0, hearts, heartT;
  let hornCd = 0;
  let cryT = 6, lightT = -1, nextLight = 8, onc = null, nextOnc = 15, glare = 0;
  let roadOff = 0, pops, crashT, flash = 0, barShake = 0, overShownAt = 0;
  const rain = [];
  let god = false, timeScale = 1;
  const A = 1.45; // 와이퍼 회전 각도 범위

  function geom() {
    const roadL = W * 0.06, roadW = W * 0.88, laneW = roadW / 3;
    const carW = laneW * 0.46, carH = carW * 1.7;
    return { roadL, roadW, laneW, carW, carH, carTop: H - carH - 24 };
  }
  function laneX(i) { const g = geom(); return g.roadL + g.laneW * (i + 0.5); }
  function speedNow() { return Math.min(C.SPEED_MAX, C.SPEED0 + C.SPEED_STEP * Math.floor(t / C.SPEED_EVERY)); }

  function resize() {
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = wcv.width = mcv.width = Math.round(W * dpr); cv.height = wcv.height = mcv.height = Math.round(H * dpr);
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    mainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (lane !== undefined) carX = laneX(lane);
    if (!rain.length) {
      for (let i = 0; i < 70; i++) rain.push({ x: Math.random() * (W + 60), y: Math.random() * H, len: 10 + Math.random() * 14, v: 500 + Math.random() * 300 });
    }
  }

  function reset() {
    t = 0; score = 0; lane = 1; carX = laneX(1);
    goats = []; drops = []; wet = 0; spawnT = 0.8; dropT = C.DROP_EVERY;
    heat = 0; shownHeat = 0; over = false; holdTime = 0; sweep = null;
    pops = []; crashT = 0; flash = 0; barShake = 0;
    lives = C.LIVES; invuln = 0; hitShake = 0; hearts = []; heartT = C.HEART_FIRST;
    hornCd = 0; cryT = 3 + Math.random() * 4; lightT = -1; nextLight = 5 + Math.random() * 5; onc = null; nextOnc = C.ONCOMING_FROM + Math.random() * 5; glare = 0;
    wipeUp();
  }

  // ===== 소리 =====
  const S = { ac: null, master: null, noise: null, rain: null, muted: false };
  try { S.muted = localStorage.getItem('goranee_mute') === '1'; } catch (e) {}
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.textContent = S.muted ? '🔇' : '🔊';
  function audioInit() {
    if (S.ac) { if (S.ac.state === 'suspended') S.ac.resume(); return; }
    try {
      S.ac = new (window.AudioContext || window.webkitAudioContext)();
      S.master = S.ac.createGain();
      S.master.gain.value = S.muted ? 0 : 0.8;
      S.master.connect(S.ac.destination);
      const len = S.ac.sampleRate * 2;
      S.noise = S.ac.createBuffer(1, len, S.ac.sampleRate);
      const d = S.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      makeGoatBuffers();
      loadGoatSample();
    } catch (e) { S.ac = null; }
  }
  function env(g, t0, peak, attack, dur) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  // 잡음 소리: f는 [시간, 주파수] 목록
  function noise(dur, o) {
    if (!S.ac) return;
    const t0 = S.ac.currentTime + (o.delay || 0);
    const src = S.ac.createBufferSource(); src.buffer = S.noise; src.loop = true;
    const fl = S.ac.createBiquadFilter(); fl.type = o.type || 'lowpass'; fl.Q.value = o.q || 1;
    (o.f || [[0, 1000]]).forEach(([tt, fr], i) => i === 0 ? fl.frequency.setValueAtTime(fr, t0 + tt) : fl.frequency.exponentialRampToValueAtTime(fr, t0 + tt));
    const g = S.ac.createGain(); env(g, t0, o.gain || 0.2, o.attack || 0.01, dur);
    src.connect(fl); fl.connect(g); g.connect(S.master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  }
  // 음 소리: f는 [시간, 주파수] 목록
  function tone(dur, o) {
    if (!S.ac) return;
    const t0 = S.ac.currentTime + (o.delay || 0);
    const os = S.ac.createOscillator(); os.type = o.wave || 'sine';
    o.f.forEach(([tt, fr], i) => i === 0 ? os.frequency.setValueAtTime(fr, t0 + tt) : os.frequency.exponentialRampToValueAtTime(fr, t0 + tt));
    const g = S.ac.createGain(); env(g, t0, o.gain || 0.2, o.attack || 0.005, dur);
    let out = os;
    if (o.bp) { const fl = S.ac.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = o.bp; fl.Q.value = 2; os.connect(fl); out = fl; }
    out.connect(g); g.connect(S.master);
    os.start(t0); os.stop(t0 + dur + 0.05);

  function loadSample(uri, key) {
    if (S[key] || S[key + 'Loading']) return;
    S[key + 'Loading'] = true;
    try {
      const bin = atob(uri.split(',')[1]);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const done = b => { S[key] = b; };
      const p = S.ac.decodeAudioData(arr.buffer, done, () => {});
      if (p && p.then) p.then(done).catch(() => {});
    } catch (e) {}

  function loadGoatSample() {
    loadSample(HONK_MP3, 'honkBuf');
    loadSample(WIPER_MP3, 'wiperBuf');
    loadSample(THUNDER_MP3, 'thunderBuf');
    loadSample(ALARM_MP3, 'alarmBuf');
    loadSample(GOAT_MP3, 'goatBuf');

  // 녹음 재생: rate로 음 높이, offset과 dur로 일부만, far면 멀리서 들리게
  function playSample(o) {
    const buf = o.buf || S.goatBuf;
    if (!S.ac || !buf) return false;
    const ac = S.ac, t0 = ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource(); src.buffer = buf;
    src.playbackRate.value = o.rate || 1;
    const g = ac.createGain();
    const dur = o.dur || buf.duration;
    g.gain.setValueAtTime(o.gain, t0);
    g.gain.setValueAtTime(o.gain, t0 + Math.max(0.01, dur / (o.rate || 1) - 0.15));
    g.gain.linearRampToValueAtTime(0.0001, t0 + dur / (o.rate || 1));
    src.connect(g);
    let last = g;
    if (o.far) {
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
      g.connect(lp); last = lp;
      const dl = ac.createDelay(1); dl.delayTime.value = 0.24;
      const fb = ac.createGain(); fb.gain.value = 0.35;
      lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(S.master);
    }
    last.connect(S.master);
    src.start(t0, o.offset || 0, dur);
    return true;
  }

  // [시간, 값] 점들을 직선으로 이음
  function interp(pts, t) {
    if (t <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      if (t <= pts[i][0]) {
        const [t0, v0] = pts[i - 1], [t1, v1] = pts[i];
        return v0 + (v1 - v0) * (t - t0) / (t1 - t0);
      }
    }
    return pts[pts.length - 1][1];
  }
  // 고라니 울음 만들기: 목이 쉰 듯 거칠게 떨리는 성대 + 숨소리 + 찌그러짐
  function makeGoatBuffer(sr, dur, pitch, envPts, opt) {
    opt = opt || {};
    const BR = opt.breath ?? 0.55, RG = opt.rough ?? 0.45, SB = opt.sub ?? 0.35, DR = opt.drive ?? 2.2;
    const n = Math.floor(sr * dur);
    const buf = S.ac.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    let ph = 0, jit = 0, rph = 0, rate = 70, sub = 0;
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      jit += (Math.random() - 0.5) * 0.08; jit *= 0.998;          // 음 높이가 불안정하게 흔들림
      rate += (Math.random() - 0.5) * 3; rate = Math.max(45, Math.min(95, rate));
      const f = interp(pitch, t) * (1 + jit * 0.06);
      ph += f / sr; if (ph >= 1) { ph -= 1; sub = Math.random() < SB ? 1 - sub : sub; }
      rph += rate / sr;
      // 성대: 뾰족한 펄스 모양 (톱니보다 거칠고 목소리 같음)
      const glottal = Math.pow(1 - ph, 3) * 2 - 0.5;
      const subh = sub ? 0.35 : -0.35;                             // 가끔 한 옥타브 아래로 갈라지는 소리
      const rough = (1 - RG) + RG * Math.abs(Math.sin(Math.PI * rph)); // 긁는 듯한 떨림
      const breath = (Math.random() * 2 - 1) * BR;               // 쉰 숨소리
      let x = (glottal + subh * 0.4 + breath) * rough;
      x = Math.tanh(x * DR);                                     // 찌그러뜨려서 날카롭게
      d[i] = x * interp(envPts, t);
    }
    return buf;
  }
  function makeGoatBuffers() {

  // 모음이 시간에 따라 바뀌는 목소리 (꿰 -> 에에에 -> 엥 -> 엑)
  // track: [시간, F1, F2, F3, 콧소리]
  function playVowel(buf, gain, track) {
    if (!S.ac || !buf) return;
    const ac = S.ac, t0 = ac.currentTime;
    const src = ac.createBufferSource(); src.buffer = buf;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 200;
    src.connect(hp);
    const mix = ac.createGain(); mix.gain.value = gain;
    const qs = [3, 5, 6], gs = [1, 0.85, 0.5];
    for (let k = 0; k < 3; k++) {
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = qs[k];
      track.forEach(([tt, ...fs], i) => i === 0 ? bp.frequency.setValueAtTime(fs[k], t0 + tt) : bp.frequency.linearRampToValueAtTime(fs[k], t0 + tt));
      const gg = ac.createGain(); gg.gain.value = gs[k] * 2.4;
      hp.connect(bp); bp.connect(gg); gg.connect(mix);
    }
    // 콧소리 (엥)
    const nb = ac.createBiquadFilter(); nb.type = 'bandpass'; nb.frequency.value = 280; nb.Q.value = 2;
    const ng = ac.createGain();
    track.forEach(([tt, , , , nz], i) => i === 0 ? ng.gain.setValueAtTime(nz * 3, t0 + tt) : ng.gain.linearRampToValueAtTime(nz * 3, t0 + tt));
    hp.connect(nb); nb.connect(ng); ng.connect(mix);
    mix.connect(S.master);
    src.start(t0);
  }

  // 목소리 필터 ("애" 모음 소리) 거쳐 재생. far면 멀리서 들리게
  function playGoat(buf, gain, far) {
    if (!S.ac || !buf) return;
    const ac = S.ac;
    const src = ac.createBufferSource(); src.buffer = buf;
    src.playbackRate.value = far ? 0.9 + Math.random() * 0.2 : 0.96 + Math.random() * 0.08;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 280;
    src.connect(hp);
    const mix = ac.createGain(); mix.gain.value = gain;
    [[750, 2.5, 1], [1800, 4, 0.8], [2900, 5, 0.45]].forEach(([fr, q, g]) => {
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fr; bp.Q.value = q;
      const gg = ac.createGain(); gg.gain.value = g * 2.2;
      hp.connect(bp); bp.connect(gg); gg.connect(mix);
    });
    let last = mix;
    if (far) {
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
      mix.connect(lp); last = lp;
      // 산에 울리는 메아리
      const dl = ac.createDelay(1); dl.delayTime.value = 0.23;
      const fb = ac.createGain(); fb.gain.value = 0.35;
      lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(S.master);
    }
    last.connect(S.master);
    src.start();
  }

  const sfx = {

  function startRain() {
    if (!S.ac || S.rain) return;
    const src = S.ac.createBufferSource(); src.buffer = S.noise; src.loop = true;
    const fl = S.ac.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 3200; fl.Q.value = 0.5;
    const g = S.ac.createGain(); g.gain.value = 0.06;
    src.connect(fl); fl.connect(g); g.connect(S.master); src.start();
    S.rain = src;
  }
  function motor(on) {
    if (!S.ac) return;
    if (on && !S.motor) {
      const ac = S.ac;
      const os = ac.createOscillator(); os.type = 'sawtooth'; os.frequency.value = 85;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.05, ac.currentTime + 0.15);
      os.connect(lp); lp.connect(g); g.connect(S.master); os.start();
      S.motor = { os, g };
    } else if (!on && S.motor) {
      const { os, g } = S.motor; const ac = S.ac;
      g.gain.setValueAtTime(g.gain.value, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.12);
      os.stop(ac.currentTime + 0.15); S.motor = null;
    }
  }
  function stopRain() { if (S.rain) { try { S.rain.stop(); } catch (e) {} S.rain = null; } }
  muteBtn.addEventListener('click', () => {

  // ===== 최고 점수 =====
  function loadBest() { try { return +localStorage.getItem('goranee_best') || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem('goranee_best', String(v)); } catch (e) {} }
  let best = loadBest();
  const bestStart = document.getElementById('bestStart');
  const bestOver = document.getElementById('bestOver');
  bestStart.textContent = best > 0 ? '(최고 ' + best + ')' : '';

  // ===== 전체 랭킹 (Firebase가 연결된 곳에서만 보임) =====
  const rankBox = document.getElementById('rankBox');
  const rankStartBox = document.getElementById('rankStartBox');
  const rankList = document.getElementById('rankList');
  const rankStartList = document.getElementById('rankStartList');
  const nameInput = document.getElementById('nameInput');
  const submitBtn = document.getElementById('submitBtn');
  const rankMsg = document.getElementById('rankMsg');
  const myIds = new Set();
  let ranks = null, submitted = false, rankOn = false;
  let savedName = '';
  try { savedName = localStorage.getItem('goranee_name') || ''; } catch (e) {}
  nameInput.value = savedName;
  function saveName(n) { savedName = n; try { localStorage.setItem('goranee_name', n); } catch (e) {} }

  function fillList(ol, rows, n) {
    ol.textContent = '';
    if (!rows) { const li = document.createElement('li'); li.textContent = '랭킹을 불러오지 못했어요'; ol.appendChild(li); return; }
    if (!rows.length) { const li = document.createElement('li'); li.textContent = '아직 기록이 없어요. 첫 번째가 되어 보세요!'; ol.appendChild(li); return; }
    rows.slice(0, n).forEach((r, i) => {
      const li = document.createElement('li');
      if (myIds.has(r.id)) li.className = 'me';
      const no = document.createElement('span'); no.className = 'no'; no.textContent = (i < 3 ? ['🥇', '🥈', '🥉'][i] : (i + 1) + '.');
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = String(r.name || '익명');
      const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = Number(r.score) || 0;
      li.append(no, nm, sc); ol.appendChild(li);
    });

  function renderRanks() {
    fillList(rankList, ranks, 10);

  }

  // ===== 기록 보기 화면 =====
  const recOv = document.getElementById('recOv');
  const recList = document.getElementById('recList');
  const recSub = document.getElementById('recSub');
  const tabAll = document.getElementById('tabAll');
  const tabMine = document.getElementById('tabMine');
  let recTab = 'all';
  function loadHistory() { try { return JSON.parse(localStorage.getItem('goranee_history') || '[]'); } catch (e) { return []; } }
  function addHistory(sc) {
    const h = loadHistory();
    h.unshift({ s: sc, t: Date.now() });
    try { localStorage.setItem('goranee_history', JSON.stringify(h.slice(0, 50))); } catch (e) {}
  }
  function fmtTime(ms) {
    const d = new Date(ms);
    const pad = n => String(n).padStart(2, '0');
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function renderRec() {
    tabAll.classList.toggle('on', recTab === 'all');
    tabMine.classList.toggle('on', recTab === 'mine');
    recList.textContent = '';
    const note = t => { const li = document.createElement('li'); li.textContent = t; recList.appendChild(li); };
    if (recTab === 'all') {
      if (!rankOn) { recSub.textContent = ''; note('전체 랭킹은 github.io 게임 주소에서만 볼 수 있어요'); return; }
      recSub.textContent = 'TOP 50 (실시간)';
      if (ranks === null) { fillList(recList, null, 50); return; }
      fillList(recList, ranks, 50);
      return;
    }
    const h = loadHistory();
    const bestH = h.reduce((m, r) => Math.max(m, r.s), 0);
    recSub.textContent = '이 기기에서 한 최근 ' + h.length + '판 (최고 ' + bestH + '점)';
    if (!h.length) { note('아직 기록이 없어요. 한 판 해 보세요!'); return; }
    h.forEach((r, i) => {
      const li = document.createElement('li');
      if (r.s === bestH && bestH > 0) li.className = 'me';
      const no = document.createElement('span'); no.className = 'no'; no.textContent = (i + 1) + '.';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = fmtTime(r.t) + (r.s === bestH && bestH > 0 ? '  🏆' : '');
      const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = r.s;
      li.append(no, nm, sc); recList.appendChild(li);
    });
  }
  function openRec(tab) { recTab = tab || recTab; recOv.classList.remove('hidden'); renderRec(); }
  document.getElementById('recBtnStart').addEventListener('click', () => openRec('all'));
  document.getElementById('recBtnOver').addEventListener('click', () => openRec('all'));
  document.getElementById('recClose').addEventListener('click', () => recOv.classList.add('hidden'));
  tabAll.addEventListener('click', () => { recTab = 'all'; renderRec(); });
  tabMine.addEventListener('click', () => { recTab = 'mine'; renderRec(); });
  function hookRanking() {
    if (rankOn || !window.ranking) return;
    rankOn = true;
    rankBox.classList.remove('hidden');
    window.ranking.subscribe((rows) => { ranks = rows; renderRanks(); });

  // 기록 저장. 이름을 한 번 적어 두면 그다음부터는 게임오버 때마다 자동으로 저장
  async function submitScore(auto) {
    if (!window.ranking || submitted || score <= 0) return;
    const name = (auto ? savedName : nameInput.value).trim().slice(0, 10);
    if (!name) { rankMsg.textContent = '이름을 적고 저장하면, 다음 판부터는 자동으로 저장돼요'; nameInput.focus(); return; }
    submitted = true;
    submitBtn.disabled = true; rankMsg.textContent = '저장하는 중…';
    try {
      const id = await window.ranking.submit(name, Math.max(0, Math.min(9999, Math.floor(score))));
      myIds.add(id);
      saveName(name);
      rankMsg.textContent = auto ? '「' + name + '」 이름으로 자동 저장됐어요 🎉' : '저장 완료! 다음 판부터는 자동으로 저장돼요 🎉';
      renderRanks();
    } catch (e) {
      submitted = false;
      submitBtn.disabled = false;
      rankMsg.textContent = '저장에 실패했어요. 저장 버튼을 다시 눌러 주세요';
    }
  }
  // 이미 저장한 뒤 이름을 바꾸면 다음 판부터 적용
  function changeName() {
    const n = nameInput.value.trim().slice(0, 10);
    if (!n || n === savedName) return;
    saveName(n);
    rankMsg.textContent = '다음 판부터 「' + n + '」 이름으로 저장돼요';
  }
  submitBtn.addEventListener('click', () => submitted ? changeName() : submitScore(false));
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitted ? changeName() : submitScore(false); } });
  nameInput.addEventListener('input', () => { if (submitted) submitBtn.disabled = !nameInput.value.trim() || nameInput.value.trim() === savedName; });

  function startGame() {
    audioInit();
    startRain();
    reset();
    state = 'play';
    startOv.classList.add('hidden');
    overOv.classList.add('hidden');
  }

  function makeGoat(l, y) {
    const g = geom();
    const w = g.laneW * 0.5, h = w * 1.25;
    return { lane: l, x: laneX(l), y: y === undefined ? -h : y, w, h, ph: Math.random() * 6, seed: Math.random() * 3, jump: false };
  }
  // y 근처(차가 빠져나갈 수 있는 거리 안)에서 이미 막힌 차선들
  function blockedNear(y) {
    const g = geom();
    const D = g.carH + g.laneW * 0.625 + speedNow() * 0.3; // 차 길이 + 고라니 길이 + 반응 여유
    const s = new Set();
    for (const go of goats) {
      if (Math.abs(go.y - y) >= D || go.escape) continue;
      // 옆으로 뛰어드는 중인 고라니는 지나가는 차선 전부를 막은 것으로 봄
      if (go.jump && go.path) go.path.forEach(l => s.add(l));
      else s.add(go.lane);
    }
    return s;
  }
  // 새로 놓을 차선들을 더해도 최소 한 차선은 비어 있는지
  function fair(blocked, lanes) {
    const s = new Set(blocked);
    lanes.forEach(l => s.add(l));
    return s.size < 3;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function spawnGoat() {
    const g = geom();
    const h = g.laneW * 0.5 * 1.25;

    if (t > C.JUMP_FROM && Math.random() < C.JUMP_CHANCE) {
      // 길가에서 갑자기 튀어나와 옆으로 뛰어듦
      // 빨라질수록 더 위에서 튀어나와야 건너올 시간이 생김
      const sp = speedNow();
      const jumpSpeed = C.JUMP_SPEED * Math.max(1, sp / 300);
      const gm = geom();
      const yMin = H * 0.05;
      const yFor = (l, side) => {
        const startX = side === 'L' ? -gm.laneW * 0.5 : W + gm.laneW * 0.5;
        const cross = Math.abs(laneX(l) - startX) / jumpSpeed;
        const yMax = Math.min(H * 0.33, gm.carTop - h - sp * (cross + C.JUMP_SAFE));
        return yMax < yMin ? null : yMin + Math.random() * (yMax - yMin);
      };
      const y = H * 0.05 + Math.random() * H * 0.28;
      const near = blockedNear(y);
      // 가능한 (목표 차선, 들어오는 쪽) 조합. 가까운 쪽에서만 들어옴
      const opts = [];
      [0, 1, 2].forEach(l => {
        const sides = l === 0 ? ['L'] : l === 2 ? ['R'] : ['L', 'R'];
        sides.forEach(side => {
          const path = side === 'L' ? [0, 1, 2].filter(i => i <= l) : [0, 1, 2].filter(i => i >= l);
          // 지나가는 길에 다른 고라니가 없고, 지나간 뒤에도 한 차선은 비어 있어야 함
          if (path.some(i => near.has(i))) return;
          if (!fair(near, path)) return;
          opts.push({ l, side, path });
        });
      });
      if (opts.length) {
        const o = pick(opts);
        const yy = yFor(o.l, o.side);
        if (yy !== null) {
        const near2 = blockedNear(yy);
        if (!o.path.some(i => near2.has(i)) && fair(near2, o.path)) {
        const go = makeGoat(o.l, yy);
        go.jumpSpeed = jumpSpeed;
        go.x = o.side === 'L' ? -go.w : W + go.w;
        go.jump = true;
        go.path = o.path;
        goats.push(go);
        sfx.goatCry();
        return;
        }
        }
      }
    }

    const blocked = blockedNear(-h);
    const ok = [0, 1, 2].filter(l => fair(blocked, [l]));
    if (ok.length) goats.push(makeGoat(pick(ok)));
  }

  function addDrop() {
    if (drops.length >= C.DROP_MAX) return;
    drops.push({ x: Math.random() * W, y: Math.random() * H * 0.82, r: 12 + Math.random() * 24, s: 0, keep: false });
  }

  function move(d) {
    if (state !== 'play') return;
    lane = Math.max(0, Math.min(2, lane + d));
  }

  function startSweep() {
    const spd = 0.35 + 0.65 * wipePower();
    sfx.wipe(Math.min(0.9, C.WIPE_TIME / spd), 1 - wet);
    sweep = { p: 0, dir: wipeDir, ang: wipeDir > 0 ? -A : A };
    wipeDir *= -1;
  }

  function wipeDown() {
    if (wipeHeld) return;
    wipeHeld = true;
    wipeBtn.classList.add('pressed');
    if (state === 'play' && over) barShake = 0.3;
  }
  // 와이퍼 힘: 누른 직후엔 거의 0, 오래 누를수록 1에 가까워짐
  function wipePower() {
    if (!wipeHeld || over || state !== 'play') return 0;
    return Math.pow(Math.min(1, holdTime / C.WIPE_RAMP), 1.5);
  }
  function wipeUp() {
    wipeHeld = false;
    holdTime = 0;
    wipeBtn.classList.remove('pressed');
  }

  // 경적: 내 차선에 있는 고라니가 모두 옆 차선이나 화면 밖으로 도망
  function honk() {
    if (state !== 'play' || hornCd > 0) return;
    hornCd = C.HORN_COOLDOWN;
    sfx.horn();
    const g = geom();
    pops.push({ x: carX, y: g.carTop - 50, life: 0.8, text: '빠앙!', col: '#ffd36b' });
    const mine = goats.filter(go => !go.escape && go.lane === lane && go.y - go.h / 2 < g.carTop + g.carH);
    const D = g.carH + g.laneW * 0.625;
    for (const go of mine) {
      // 비킬 수 있는 옆 차선: 그 근처에 다른 고라니가 없어야 함
      const side = [lane - 1, lane + 1].filter(l => l >= 0 && l <= 2 &&
        !goats.some(o => o !== go && !o.escape && o.lane === l && Math.abs(o.y - go.y) < D));
      if (side.length && Math.random() < 0.5) {
        const to = side[Math.floor(Math.random() * side.length)];
        go.path = [lane, to]; go.lane = to; go.jump = true; go.jumpSpeed = C.FLEE_SPEED;
      } else {
        // 화면 밖으로: 가까운 쪽 길가로
        const dir = lane === 0 ? -1 : lane === 2 ? 1 : (Math.random() < 0.5 ? -1 : 1);
        go.escape = dir; go.jump = false;
      }
    }
  }

  function crash() {
    sfx.crash(); sfx.goatScream(); stopRain();
    state = 'crash';
    crashT = 0.7; flash = 1;
    wipeUp();
    if (navigator.vibrate) { try { navigator.vibrate(200); } catch (e) {} }
  }

  function update(dt) {
    const rs = state === 'play' ? speedNow() : 120;
    for (const r of rain) {
      r.y += (r.v + rs * 0.4) * dt; r.x -= 40 * dt;
      if (r.y > H) { r.y = -r.len; r.x = Math.random() * (W + 60); }
      if (r.x < -20) r.x = W + 10;
    }
    flash = Math.max(0, flash - dt * 2);
    barShake = Math.max(0, barShake - dt);
    hitShake = Math.max(0, hitShake - dt);
    for (const p of pops) p.life -= dt;
    pops = pops.filter(p => p.life > 0);

    if (state === 'start') { roadOff = (roadOff + 90 * dt) % 60; carX = laneX(lane); }

    if (state === 'play') {
      t += dt;
      const speed = speedNow();
      roadOff = (roadOff + speed * dt) % 60;
      carX += (laneX(lane) - carX) * Math.min(1, dt * 18);

      spawnT -= dt;
      if (spawnT <= 0) { spawnGoat(); spawnT = Math.max(C.SPAWN_MIN, C.SPAWN0 - C.SPAWN_DEC * t); }

      for (const go of goats) {
        go.ph += dt * 12;
        const tx = laneX(go.lane);
        if (go.escape) {
          go.y += speed * dt;
          go.x += go.escape * C.FLEE_SPEED * dt;
        } else if (go.jump) {
          go.y += speed * dt;
          const dx = tx - go.x, step = (go.jumpSpeed || C.JUMP_SPEED) * dt;
          if (Math.abs(dx) <= step) { go.x = tx; go.jump = false; } else go.x += Math.sign(dx) * step;
        } else { go.x = tx; go.y += speed * dt; }
      }
      const g = geom();
      goats = goats.filter(go => {
        if (go.escape && (go.x < -go.w || go.x > W + go.w)) { score++; sfx.score(); pops.push({ x: carX, y: g.carTop - 34, life: 0.8, text: '+1', col: '#7CFC9A' }); return false; }
        if (go.y - go.h / 2 > H) { score++; sfx.score(); pops.push({ x: carX, y: g.carTop - 34, life: 0.8, text: '+1', col: '#7CFC9A' }); return false; }
        return true;
      });

      const cx0 = carX - g.carW * 0.42, cx1 = carX + g.carW * 0.42;
      const cy0 = g.carTop + g.carH * 0.06, cy1 = g.carTop + g.carH * 0.95;
      invuln = Math.max(0, invuln - dt);
      let hitGoat = null;
      for (const go of goats) {
        const gx = go.x;
        const gx0 = gx - go.w * 0.34, gx1 = gx + go.w * 0.34;
        const gy0 = go.y - go.h * 0.4, gy1 = go.y + go.h * 0.46;
        if (!god && invuln <= 0 && cx0 < gx1 && cx1 > gx0 && cy0 < gy1 && cy1 > gy0) { hitGoat = go; break; }
      }
      if (hitGoat) {
        lives--;
        if (lives <= 0) crash();
        else {
          sfx.hit(); sfx.goatScream();
          goats = goats.filter(go => go !== hitGoat);
          invuln = C.INVULN; flash = 0.8; hitShake = 0.35;
          pops.push({ x: carX, y: g.carTop - 34, life: 0.8, text: '-❤', col: '#ff5a5a' });
          if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
        }
      }

      // 하트 (가끔 떨어짐, 먹으면 목숨 +1)
      if (state === 'play') {
        heartT -= dt;
        if (heartT <= 0) {
          heartT = C.HEART_MIN + Math.random() * (C.HEART_MAX - C.HEART_MIN);
          if (lives < C.LIVES) hearts.push({ lane: Math.floor(Math.random() * 3), y: -30, ph: 0 });
        }
        const hs = g.laneW * 0.17;
        hearts = hearts.filter(ht => {
          ht.y += speed * dt; ht.ph += dt;
          const hx = laneX(ht.lane);
          if (cx0 < hx + hs && cx1 > hx - hs && cy0 < ht.y + hs && cy1 > ht.y - hs) {
            lives = Math.min(C.LIVES, lives + 1); sfx.heart();
            pops.push({ x: carX, y: g.carTop - 34, life: 0.8, text: '+❤', col: '#ff7aa8' });
            return false;
          }
          return ht.y - hs < H;
        });
      }

      dropT -= dt;
      while (dropT <= 0) { addDrop(); dropT += C.DROP_EVERY; }
      for (const d of drops) d.s = Math.min(1, d.s + dt * 4);
      wet = Math.min(1, wet + C.WET_RATE * dt);

      // 열기: 누르고 있으면 오르고, 떼면 내려감
      if (over) { heat -= C.OVER_COOL * dt; if (heat <= 0) { heat = 0; over = false; sfx.cooled(); } }
      else if (wipeHeld) { heat += C.HEAT_RISE * dt; if (heat >= 100) { heat = 100; over = true; barShake = 0.3; sfx.overheat(); } }
      else heat = Math.max(0, heat - C.COOL * dt);

      // 가끔 멀리서 고라니 울음
      cryT -= dt;
      if (cryT <= 0) { sfx.goatFar(); cryT = 6 + Math.random() * 8; }

      // 번개
      nextLight -= dt;
      if (nextLight <= 0) {
        lightT = 0;
        nextLight = C.LIGHTNING_MIN + Math.random() * (C.LIGHTNING_MAX - C.LIGHTNING_MIN);
        sfx.thunder(0.4 + Math.random() * 0.8);
      }
      // 맞은편 차 (상향등)
      if (t > C.ONCOMING_FROM) {
        nextOnc -= dt;
        if (nextOnc <= 0 && !onc) {
          onc = { y: -80 };
          nextOnc = C.ONCOMING_MIN + Math.random() * (C.ONCOMING_MAX - C.ONCOMING_MIN);
          sfx.carPass();
        }
      }

      // 누르고 있는 동안 와이퍼가 계속 왔다 갔다
      if (wipeHeld && !over) holdTime += dt; else holdTime = 0;
      if (wipeHeld && !over && !sweep) startSweep();
    }

    if (sweep) {
      const power = wipePower();
      // 처음엔 느리게 움직이다가 힘이 붙으면 빨라짐. 떼면 닦지 않고 제자리로 돌아감
      const spd = wipeHeld ? 0.35 + 0.65 * power : 1.6;
      const dp = Math.min(dt * spd / C.WIPE_TIME, 1 - sweep.p);
      const prevAng = sweep.ang;
      sweep.p += dp;
      const p = Math.min(1, sweep.p);
      wet = Math.max(0, wet - C.WET_CLEAR * dp * power);
      const ang = sweep.dir > 0 ? -A + 2 * A * p : A - 2 * A * p;
      sweep.ang = ang;
      const chance = C.DROP_CLEAR * power;
      if (chance > 0) {
        const lo = Math.min(prevAng, ang), hi = Math.max(prevAng, ang);
        const px = W / 2, py = H + 30;
        drops = drops.filter(d => {
          const a = Math.atan2(d.x - px, py - d.y);
          if (a < lo || a > hi) return true;
          return Math.random() >= chance;
        });
      }
      if (sweep.p >= 1 - 1e-6) { if (wipeHeld) sfx.wipeEnd(); sweep = null; }
    }

    if (lightT >= 0) { lightT += dt; if (lightT > 0.7) lightT = -1; }
    if (onc) {
      onc.y += (Math.min(C.SPEED_MAX, speedNow()) * 0.9 + 260) * dt;
      if (onc.y > H + 100) onc = null;
    }
    glare = onc ? Math.pow(Math.max(0, 1 - Math.abs(onc.y - H * 0.5) / (H * 0.55)), 1.5) : Math.max(0, glare - dt * 2);

    motor(state === 'play' && wipeHeld && !over);

    shownHeat += (Math.min(heat, 100) - shownHeat) * Math.min(1, dt * 12);
    wipeBtn.classList.toggle('hot', over && state === 'play');
    if (state === 'play') hornCd = Math.max(0, hornCd - dt);
    hornBtn.classList.toggle('hidden', state !== 'play');
    hornBtn.classList.toggle('cool', hornCd > 0);
    hornBtn.style.setProperty('--p', (1 - hornCd / C.HORN_COOLDOWN).toFixed(3));

    if (state === 'crash') {
      crashT -= dt;
      if (crashT <= 0) {
        state = 'over';
        finalScore.textContent = score;
        addHistory(score);
        if (score > best) { best = score; saveBest(best); bestOver.textContent = '🏆 신기록!'; }
        else bestOver.textContent = '🏆 최고 기록 ' + best;
        bestStart.textContent = '(최고 ' + best + ')';
        submitted = false; submitBtn.disabled = false;
        nameInput.value = savedName;
        rankMsg.textContent = score > 0 ? '' : '0점은 저장되지 않아요';
        if (score <= 0) submitBtn.disabled = true;
        else if (rankOn) submitScore(true);
        overOv.classList.remove('hidden');
        overShownAt = performance.now();
      }
    }
  }

  // ===== 그리기 =====
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function ell(x, y, rx, ry, rot) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawGoat(go) {
    const x = go.x, y = go.y, w = go.w, h = go.h, b = Math.sin(go.ph) * (go.jump ? 4 : 2);
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ell(3, 5, w * 0.4, h * 0.44);
    // 다리
    ctx.fillStyle = '#4a321e';
    const lx = w * 0.24, lw = w * 0.1, lh = h * 0.16;
    ctx.fillRect(-lx - lw / 2, -h * 0.3 + b, lw, lh);
    ctx.fillRect(lx - lw / 2, -h * 0.3 - b, lw, lh);
    ctx.fillRect(-lx - lw / 2, h * 0.04 - b, lw, lh);
    ctx.fillRect(lx - lw / 2, h * 0.04 + b, lw, lh);
    // 꼬리, 몸
    ctx.fillStyle = '#6f4c2b'; ell(0, -h * 0.42, w * 0.07, h * 0.05);
    ctx.fillStyle = '#8b6239'; ell(0, -h * 0.07, w * 0.32, h * 0.34);
    ctx.fillStyle = 'rgba(255,220,170,0.12)'; ell(0, -h * 0.1, w * 0.16, h * 0.22);
    // 귀
    ctx.fillStyle = '#8b6239'; ell(-w * 0.25, h * 0.15, w * 0.12, h * 0.05, -0.5); ell(w * 0.25, h * 0.15, w * 0.12, h * 0.05, 0.5);
    ctx.fillStyle = '#d9a877'; ell(-w * 0.25, h * 0.15, w * 0.07, h * 0.025, -0.5); ell(w * 0.25, h * 0.15, w * 0.07, h * 0.025, 0.5);
    // 머리
    ctx.fillStyle = '#a0703f'; ell(0, h * 0.25, w * 0.24, h * 0.17);
    ctx.fillStyle = '#c8955f'; ell(0, h * 0.35, w * 0.13, h * 0.08);
    ctx.fillStyle = '#1a1a1a'; ell(0, h * 0.39, w * 0.06, h * 0.035);
    // 눈
    ctx.fillStyle = '#111'; ell(-w * 0.1, h * 0.24, w * 0.045, w * 0.05); ell(w * 0.1, h * 0.24, w * 0.045, w * 0.05);
    ctx.fillStyle = '#fff'; ell(-w * 0.088, h * 0.228, w * 0.014, w * 0.014); ell(w * 0.112, h * 0.228, w * 0.014, w * 0.014);
    // 송곳니 (고라니 포인트)
    ctx.fillStyle = '#f5f2e8';
    ctx.beginPath(); ctx.moveTo(-w * 0.075, h * 0.41); ctx.lineTo(-w * 0.055, h * 0.5); ctx.lineTo(-w * 0.035, h * 0.41); ctx.fill();
    ctx.beginPath(); ctx.moveTo(w * 0.075, h * 0.41); ctx.lineTo(w * 0.055, h * 0.5); ctx.lineTo(w * 0.035, h * 0.41); ctx.fill();
    ctx.restore();
  }

  function heartPath(cx, cy, r) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + r * 0.9);
    ctx.bezierCurveTo(cx - r * 1.4, cy - r * 0.1, cx - r * 0.8, cy - r * 1.2, cx, cy - r * 0.45);
    ctx.bezierCurveTo(cx + r * 0.8, cy - r * 1.2, cx + r * 1.4, cy - r * 0.1, cx, cy + r * 0.9);
    ctx.closePath();
  }

  function drawCar(x, top, w, h) {
    const l = x - w / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; rr(l + 3, top + 5, w, h, w * 0.26); ctx.fill();
    ctx.fillStyle = '#e04848'; rr(l, top, w, h, w * 0.28); ctx.fill();
    ctx.fillStyle = '#2a3242'; rr(l + w * 0.13, top + h * 0.2, w * 0.74, h * 0.2, 6); ctx.fill();
    ctx.fillStyle = 'rgba(160,190,230,0.25)'; rr(l + w * 0.18, top + h * 0.22, w * 0.3, h * 0.06, 3); ctx.fill();
    ctx.fillStyle = '#b83a3a'; rr(l + w * 0.16, top + h * 0.43, w * 0.68, h * 0.28, 6); ctx.fill();
    ctx.fillStyle = '#2a3242'; rr(l + w * 0.17, top + h * 0.74, w * 0.66, h * 0.1, 4); ctx.fill();
    ctx.fillStyle = '#fff6c8'; rr(l + w * 0.08, top + 2, w * 0.24, h * 0.055, 3); ctx.fill(); rr(l + w * 0.68, top + 2, w * 0.24, h * 0.055, 3); ctx.fill();
    ctx.fillStyle = '#ff3030'; rr(l + w * 0.08, top + h - h * 0.06, w * 0.22, h * 0.045, 2); ctx.fill(); rr(l + w * 0.7, top + h - h * 0.06, w * 0.22, h * 0.045, 2); ctx.fill();
  }

  // 번개 밝기 (번쩍, 잠깐 꺼짐, 다시 번쩍 후 서서히 꺼짐)
  function lightAmt() {
    if (lightT < 0) return 0;
    if (lightT < 0.07) return 1;
    if (lightT < 0.14) return 0.15;
    if (lightT < 0.7) return 1 - (lightT - 0.14) / 0.56;
    return 0;
  }

  function draw() {
    const g = geom();
    const now = performance.now();

    ctx = wctx;
    ctx.save();
    ctx.clearRect(0, 0, W, H);

    // 풀밭, 도로
    ctx.fillStyle = '#08100b'; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = '#151922'; ctx.fillRect(g.roadL, -20, g.roadW, H + 40);
    const sh = ctx.createLinearGradient(0, 0, 0, H);
    sh.addColorStop(0, 'rgba(60,80,120,0)'); sh.addColorStop(1, 'rgba(60,80,120,0.14)');
    ctx.fillStyle = sh; ctx.fillRect(g.roadL, 0, g.roadW, H);
    ctx.fillStyle = 'rgba(235,235,235,0.5)';
    ctx.fillRect(g.roadL, -20, 3, H + 40); ctx.fillRect(g.roadL + g.roadW - 3, -20, 3, H + 40);
    ctx.fillStyle = 'rgba(240,240,240,0.45)';
    for (let i = 1; i <= 2; i++) {
      const x = g.roadL + g.laneW * i;
      for (let y = -60 + roadOff; y < H; y += 60) ctx.fillRect(x - 2, y, 4, 30);
    }
    // 길가 반사판
    ctx.fillStyle = 'rgba(255,170,60,0.55)';
    for (let y = -120 + ((roadOff * 2) % 120); y < H; y += 120) {
      ctx.fillRect(g.roadL - 10, y, 4, 8); ctx.fillRect(g.roadL + g.roadW + 6, y, 4, 8);
    }

    if (goats) goats.forEach(drawGoat);

    if (hearts) for (const ht of hearts) {
      const r = g.laneW * 0.15 * (1 + Math.sin(ht.ph * 6) * 0.08);
      heartPath(laneX(ht.lane), ht.y, r);
      ctx.fillStyle = '#ff4f7b'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#ffd0dd'; ctx.stroke();
    }
    if (!(invuln > 0 && Math.floor(invuln * 10) % 2 === 0)) drawCar(carX, g.carTop, g.carW, g.carH);

    // 내리는 비
    ctx.strokeStyle = 'rgba(170,195,235,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const r of rain) { ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.len * 0.25, r.y + r.len); }
    ctx.stroke();

    // 어둠: 헤드라이트가 비추는 곳만 뚫어 보이게
    {
      const m = mctx;
      const gy = g.carTop, far = gy - H * C.LIGHT_REACH;
      const spread = g.laneW * C.LIGHT_SPREAD;
      m.save();
      m.globalCompositeOperation = 'source-over';
      m.clearRect(0, 0, W, H);
      m.fillStyle = 'rgba(1,2,6,' + (C.DARK * (1 - 0.88 * lightAmt())).toFixed(3) + ')';
      m.fillRect(0, 0, W, H);
      m.globalCompositeOperation = 'destination-out';
      m.filter = 'blur(10px)';
      const lg = m.createLinearGradient(0, gy, 0, far);
      lg.addColorStop(0, 'rgba(0,0,0,1)');
      lg.addColorStop(0.55, 'rgba(0,0,0,0.85)');
      lg.addColorStop(1, 'rgba(0,0,0,0)');
      m.fillStyle = lg;
      m.beginPath();
      m.moveTo(carX - g.carW * 0.42, gy + 6); m.lineTo(carX - spread, far);
      m.lineTo(carX + spread, far); m.lineTo(carX + g.carW * 0.42, gy + 6);
      m.closePath(); m.fill();
      m.filter = 'none';
      const cy = gy + g.carH / 2;
      const rg = m.createRadialGradient(carX, cy, 0, carX, cy, g.carH * 1.1);
      rg.addColorStop(0, 'rgba(0,0,0,0.95)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
      m.fillStyle = rg; m.fillRect(0, 0, W, H);
      m.restore();
      ctx.drawImage(mcv, 0, 0, W, H);

      // 어둠 속에서 헤드라이트에 반사돼 반짝이는 고라니 눈
      if (goats) for (const go of goats) {
        const appear = Math.min(1, (go.y + go.h) / (H * 0.25));
        if (appear <= 0) continue;
        const ct = state === 'play' || state === 'crash' ? t : now / 1000;
        if ((ct + go.seed) % 2.6 < 0.12) continue; // 가끔 눈 깜빡임
        const inLane = Math.abs(go.x - carX) < g.laneW * 0.6;
        const a = (inLane ? 0.95 : 0.5) * appear;
        const er = go.w * 0.13;
        for (const sx of [-1, 1]) {
          const ex = go.x + sx * go.w * 0.1, ey = go.y + go.h * 0.24;
          const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, er);
          eg.addColorStop(0, 'rgba(225,255,150,' + (a * 0.7).toFixed(3) + ')');
          eg.addColorStop(1, 'rgba(225,255,150,0)');
          ctx.fillStyle = eg; ctx.fillRect(ex - er, ey - er, er * 2, er * 2);
          ctx.fillStyle = 'rgba(250,255,215,' + a.toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(ex, ey, go.w * 0.035, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (hearts) for (const ht of hearts) {
        const hx = laneX(ht.lane), r = g.laneW * 0.5;
        const hg = ctx.createRadialGradient(hx, ht.y, 0, hx, ht.y, r);
        hg.addColorStop(0, 'rgba(255,80,130,' + (0.35 + Math.sin(ht.ph * 6) * 0.1) + ')');
        hg.addColorStop(1, 'rgba(255,80,130,0)');
        ctx.fillStyle = hg; ctx.fillRect(hx - r, ht.y - r, r * 2, r * 2);
      }

      // 라이트 색감
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const tg = ctx.createLinearGradient(0, gy, 0, far);
      tg.addColorStop(0, 'rgba(255,236,170,0.16)'); tg.addColorStop(1, 'rgba(255,236,170,0)');
      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.moveTo(carX - g.carW * 0.36, gy); ctx.lineTo(carX - spread * 0.9, far);
      ctx.lineTo(carX + spread * 0.9, far); ctx.lineTo(carX + g.carW * 0.36, gy);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // 세계를 화면에 옮기면서, 젖은 만큼 흐리게
    ctx = mainCtx;
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    const shk = state === 'crash' ? crashT * 16 : hitShake * 30;
    if (shk > 0) ctx.translate((Math.random() - 0.5) * shk, (Math.random() - 0.5) * shk);
    const blur = state === 'start' ? 0 : wet * C.BLUR_MAX;
    if (blur > 0.3) ctx.filter = 'blur(' + blur.toFixed(1) + 'px)';
    ctx.drawImage(wcv, 0, 0, W, H);
    ctx.filter = 'none';
    ctx.restore();

    // 앞유리 빗방울 + 뿌옇게
    // 번개 하늘빛
    const L = lightAmt();
    if (L > 0) { ctx.fillStyle = 'rgba(200,215,255,' + (L * 0.2).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }

    if (state !== 'start' && wet > 0) {
      ctx.fillStyle = 'rgba(38,46,60,' + (wet * 0.9).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (drops && drops.length) {
      for (const d of drops) {
        const r = d.r * (0.4 + 0.6 * d.s);
        ctx.fillStyle = 'rgba(165,185,215,0.5)';
        ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath(); ctx.arc(d.x - r * 0.35, d.y - r * 0.35, r * 0.18, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 와이퍼
    if (sweep) {
      const px = W / 2, py = H + 30, L = Math.hypot(W / 2, H + 30) + 20;
      const ex = px + Math.sin(sweep.ang) * L, ey = py - Math.cos(sweep.ang) * L;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0b0d12'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke();
    }

    // 맞은편 차 상향등 (왼쪽 맞은편 차선에서 내려옴)
    if (onc) {
      const lx = 2, ly = onc.y;
      for (const dx of [0, 14]) {
        const cg = ctx.createRadialGradient(lx + dx, ly, 0, lx + dx, ly, 26);
        cg.addColorStop(0, 'rgba(255,255,240,0.95)'); cg.addColorStop(1, 'rgba(255,255,240,0)');
        ctx.fillStyle = cg; ctx.fillRect(lx + dx - 26, ly - 26, 52, 52);
      }
    }
    if (glare > 0.01) {
      const gx = 8, gy2 = onc ? onc.y : H * 0.5;
      const R2 = Math.max(W, H) * 1.1;
      const bg = ctx.createRadialGradient(gx, gy2, 0, gx, gy2, R2);
      bg.addColorStop(0, 'rgba(255,253,235,' + (glare * 0.97).toFixed(3) + ')');
      bg.addColorStop(0.45, 'rgba(255,250,225,' + (glare * 0.6).toFixed(3) + ')');
      bg.addColorStop(1, 'rgba(255,250,225,' + (glare * 0.2).toFixed(3) + ')');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    }

    // 열기 바 (차 바로 위)
    if (state !== 'start' && (shownHeat > 0.5 || over)) {
      const bw = 120, bh = 8;
      let bx = Math.max(6, Math.min(W - bw - 6, carX - bw / 2));
      const by = g.carTop - 22;
      if (barShake > 0) bx += Math.sin(barShake * 90) * 4;
      ctx.fillStyle = 'rgba(0,0,0,0.65)'; rr(bx - 2, by - 2, bw + 4, bh + 4, 5); ctx.fill();
      const f = Math.min(1, shownHeat / 100);
      let col;
      if (over) col = Math.floor(now / 120) % 2 ? '#ff3b30' : '#8f1d17';
      else col = f < 0.5 ? '#f4f4f4' : f < 0.8 ? '#ff9f1c' : '#ff3b30';
      if (f > 0.01) { ctx.fillStyle = col; rr(bx, by, bw * f, bh, 3); ctx.fill(); }
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      [0.3, 0.6, 0.9].forEach(k => ctx.fillRect(bx + bw * k - 1, by, 2, bh));
      if (over) {
        ctx.font = '900 15px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
        ctx.strokeText('과열!', bx + bw / 2, by - 8);
        ctx.fillStyle = '#ff5246'; ctx.fillText('과열!', bx + bw / 2, by - 8);
      }
    }

    // 점수
    if (state === 'play' || state === 'crash') {
      ctx.textAlign = 'center';
      ctx.font = '900 42px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(score, W / 2, 54);
      ctx.fillStyle = '#fff'; ctx.fillText(score, W / 2, 54);
      ctx.font = '700 12px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.fillText('피한 고라니', W / 2, 74);
      for (let i = 0; i < C.LIVES; i++) {
        heartPath(24 + i * 28, 30, 10);
        ctx.fillStyle = i < lives ? '#ff4f7b' : 'rgba(255,255,255,0.15)'; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = i < lives ? '#ffd0dd' : 'rgba(255,255,255,0.35)'; ctx.stroke();
      }
      ctx.textAlign = 'center';
      for (const p of pops) {
        ctx.globalAlpha = Math.max(0, p.life / 0.8);
        ctx.font = '900 20px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
        ctx.fillStyle = p.col;
        ctx.fillText(p.text, p.x, p.y - (0.8 - p.life) * 40);
        ctx.globalAlpha = 1;
      }
    }

    if (flash > 0) { ctx.fillStyle = 'rgba(255,40,40,' + flash * 0.5 + ')'; ctx.fillRect(0, 0, W, H); }
  }

  // ===== 입력 =====
  window.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (!recOv.classList.contains('hidden')) { if (e.key === 'Escape') recOv.classList.add('hidden'); return; }
    const isSpace = e.code === 'Space' || e.key === ' ';
    if (isSpace || e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Enter') e.preventDefault();
    if (state === 'start' || state === 'over') {
      if (!e.repeat && (isSpace || e.key === 'Enter')) {
        if (state === 'over' && performance.now() - overShownAt < 600) return;
        startGame();
      }
      return;
    }
    if (state !== 'play' || e.repeat) return;
    if (e.key === 'ArrowLeft') move(-1);
    else if (e.key === 'ArrowRight') move(1);
    else if (isSpace) wipeDown();
    else if (e.key === 'ArrowUp') { e.preventDefault(); honk(); }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.key === ' ') wipeUp(); });
  window.addEventListener('blur', wipeUp);
  document.addEventListener('contextmenu', e => e.preventDefault());

  function bindBtn(btn, down, up) {
    btn.addEventListener('pointerdown', e => { e.preventDefault(); down(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, up));
  }
  bindBtn(leftBtn, () => { leftBtn.classList.add('pressed'); move(-1); }, () => leftBtn.classList.remove('pressed'));
  bindBtn(rightBtn, () => { rightBtn.classList.add('pressed'); move(1); }, () => rightBtn.classList.remove('pressed'));
  bindBtn(wipeBtn, wipeDown, wipeUp);
  bindBtn(hornBtn, () => { hornBtn.classList.add('pressed'); honk(); }, () => hornBtn.classList.remove('pressed'));

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);
  // 게임오버 화면에서 시작 화면으로
  document.getElementById('homeBtn').addEventListener('click', () => {
    reset();
    state = 'start';
    overOv.classList.add('hidden');
    startOv.classList.remove('hidden');
  });

  // ===== 루프 =====
  window.addEventListener('resize', resize);
  resize();
  reset();
  state = 'start';
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * timeScale;
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

})();
</script>
<script type="module">
// ===== Firebase 전체 랭킹 =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIZFFxHOCgUiwaC9u07nUdjx6w-hHBL6g",
  authDomain: "goranee-d20c9.firebaseapp.com",
  projectId: "goranee-d20c9",
  storageBucket: "goranee-d20c9.firebasestorage.app",
  messagingSenderId: "789951919227",
  appId: "1:789951919227:web:0049227a1496b8b5c59ede"
};

try {
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const col = collection(db, "scores");
  const subs = [];
  let latest;
  onSnapshot(query(col, orderBy("score", "desc"), limit(50)),
    snap => { latest = snap.docs.map(d => ({ id: d.id, name: d.data().name, score: d.data().score })); subs.forEach(f => f(latest)); },
    err => { console.warn("ranking", err); latest = null; subs.forEach(f => f(null)); });
  window.ranking = {
    async submit(name, score) { const ref = await addDoc(col, { name, score, at: serverTimestamp() }); return ref.id; },
    subscribe(f) { subs.push(f); if (latest !== undefined) f(latest); }
  };
  window.dispatchEvent(new Event("ranking-ready"));
} catch (e) { console.warn("ranking off", e); }
</script>
